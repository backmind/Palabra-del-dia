name: Scrape Palabra del Día

on:
  schedule:
    - cron: "30 4,6,8,10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Skip if weekend or already scraped
        id: check
        run: |
          DOW=$(date -u +%u)
          if [ "$DOW" -ge 6 ]; then
            echo "Weekend (day $DOW). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          if grep -q "$TODAY" feed.xml 2>/dev/null; then
            echo "Entry for $TODAY already exists. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.check.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        run: uv python install

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: uv sync

      - name: Run scraper
        if: steps.check.outputs.skip != 'true'
        run: uv run python src/scraper.py

      - name: Commit and push feed
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update feed: $(date -u +%Y-%m-%d)"
          git push
